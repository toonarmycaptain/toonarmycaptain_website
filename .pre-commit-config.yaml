repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, markdown]

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, markdown]

      - id: ty
        name: ty
        entry: uv run ty check toonarmycaptain_website/
        language: system
        pass_filenames: false