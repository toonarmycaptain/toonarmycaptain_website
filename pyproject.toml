[project]
name = "toonarmycaptain-website"
version = "1.0.0"
description = "Personal portfolio website"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.0",
    "flask>=3.1",
    "flask-wtf>=1.2",
]

[dependency-groups]
dev = [
    "coverage>=7.0",
    "coveralls>=4.0",
    "padeploy>=0.2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-flask>=1.3",
    "ty>=0.0.1a14",
]

[tool.coverage.run]
source = ["toonarmycaptain_website"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.padeploy]
USER = "toonarmycaptain"
REMOTE_DIR = "/home/toonarmycaptain/toonarmycaptain_website"
EXCLUDE = ["README.md"]
